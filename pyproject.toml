[project]
name = "llmx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.134.0",
    "httpx>=0.28.0",
    "mistune>=3.2.0",
    "uvicorn[standard]>=0.41.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
